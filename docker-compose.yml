services:
  api:
    build: ./api
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=pos_db
      # JWT Secret - In production use a secure variable
      - JWT_SECRET=supersecretkey

  # web:
  #   build: ./web
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - ./web:/app
  #     - /app/node_modules
  #   environment:
  #     - VITE_API_URL=http://localhost:3000

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pos_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
